name: chatwit_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  serverpod: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  serverpod_cloud_storage_s3: 4.0.4
  googleapis_auth: ^2.3.3
  http: ^1.2.2


dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.4
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations
    maintenance: dart bin/main.dart --apply-migrations --role maintenance
    test: dart test
    build: dart compile exe bin/main.dart
    server: dart run chatwit_server/bin/main.dart

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\chatwit_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\chatwit_server\web\app
      posix: |
        cd ../chatwit_flutter
        flutter build web --base-href /app/ --wasm --output ../chatwit_server/web/app
