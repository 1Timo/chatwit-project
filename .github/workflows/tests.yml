name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: chatwit_ci_test_only_password
      SERVERPOD_PASSWORD_database: chatwit_ci_test_only_password

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Start containers
        working-directory: chatwit_server
        run: docker compose up --quiet-pull --build -d --wait

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli 4.0.4

      - name: Run Serverpod generator
        working-directory: chatwit_server
        run: serverpod generate

      - name: Run tests
        working-directory: chatwit_server
        run: dart test

      - name: Run Flutter tests
        working-directory: chatwit_flutter
        run: flutter test

      - name: Stop containers
        if: always()
        working-directory: chatwit_server
        run: docker compose down -v
